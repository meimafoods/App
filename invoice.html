<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Invoice</title>
<style>
  :root{--brand:#7a2e1a;--line:#e4d8c8}
  *{box-sizing:border-box}
  body{margin:0;background:#faf5ee;font:14px/1.45 system-ui,sans-serif;color:#2b2118}
  .tools{max-width:820px;margin:12px auto;display:flex;gap:10px;justify-content:space-between;padding:0 8px}
  .tools button,.tools a{background:var(--brand);color:#fff;border:0;border-radius:6px;padding:8px 14px;cursor:pointer;text-decoration:none;font:inherit}
  #inv{max-width:820px;margin:0 auto 24px;background:#fff;border:1px solid var(--line);padding:28px 30px}
  .top{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid var(--brand);padding-bottom:12px}
  .top img{height:78px}.co{text-align:right;font-size:13px}.co b{font-size:16px;color:var(--brand)}
  h1{margin:14px 0 8px;font-size:20px;letter-spacing:2px;color:var(--brand)}
  .meta{display:flex;justify-content:space-between;gap:20px;margin-bottom:14px}.meta>div{flex:1}
  .meta span{display:block;font-size:11px;color:#8a7a68;text-transform:uppercase;letter-spacing:.5px}
  table{border-collapse:collapse;width:100%}
  th,td{border:1px solid var(--line);padding:7px 9px;text-align:left}
  th{background:#f3e9dc;font-size:12px}td.n,th.n{text-align:right}
  .tot{width:300px;margin:12px 0 0 auto}.tot td{border:0;border-bottom:1px solid var(--line)}.tot tr.g td{font-weight:700;font-size:15px;border-bottom:2px solid var(--brand)}
  .badge{display:inline-block;border:1px solid;padding:2px 10px;border-radius:12px;font-size:12px}
  .sign{display:flex;justify-content:space-between;margin-top:60px;font-size:12px}.sign div{border-top:1px solid #444;width:200px;padding-top:4px;text-align:center}
  @page{size:A4;margin:12mm}
  @media print{body{background:#fff}.tools{display:none}#inv{border:0;margin:0;padding:0;max-width:none}}
</style>
</head>
<body>
<div class="tools"><a href="sales.html">← Sales</a><button onclick="window.print()">Print / Save as PDF</button></div>
<div id="inv"><p style="text-align:center;color:#8a7a68">Loading…</p></div>

<script src="meima-api.js"></script>
<script>
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rs = n => Meima.money(n);
const fmtDate = d => { const [y, m, dd] = String(d).split('-'); return `${dd}-${m}-${y}`; };

Meima.requireLogin(async () => {
  try {
    const id = new URLSearchParams(location.search).get('id');
    const [invs, custs, prods, S] = await Promise.all([Meima.call('invoice.list'), Meima.list('Customers', true), Meima.list('Products', true), Meima.settings()]);
    const v = invs.find(x => x.InvoiceID === id || x.InvoiceNo === id);
    if (!v) { document.getElementById('inv').innerHTML = '<p>Invoice not found.</p>'; return; }
    const c = custs.find(x => x.CustomerID === v.CustomerID) || {};
    const gst = String(S.GSTEnabled).toUpperCase() === 'TRUE';
    const pn = p => (prods.find(x => x.ProductID === p) || {});
    document.title = `Invoice ${v.InvoiceNo}`;
    const color = v.Status === 'Paid' ? '#1b7a3a' : v.Status === 'Part paid' ? '#b26a00' : '#b00020';
    document.getElementById('inv').innerHTML = `
      <div class="top"><img src="${Meima.LOGO}" alt="MeiMa">
        <div class="co"><b>${esc(S.CompanyName || 'Meima Foods')}</b><br>${esc(S.CompanyAddress)}${S.CompanyPhone ? '<br>Ph: ' + esc(S.CompanyPhone) : ''}
          ${S.FSSAI ? '<br>FSSAI Lic. No.: ' + esc(S.FSSAI) : ''}${gst && S.GSTIN ? '<br>GSTIN: ' + esc(S.GSTIN) : ''}</div></div>
      <h1>${gst ? 'TAX INVOICE' : 'INVOICE'}</h1>
      <div class="meta">
        <div><span>Billed to</span><b>${esc(c.Name || v.CustomerID)}</b><br>${esc(c.Address)}${c.Phone ? '<br>Ph: ' + esc(c.Phone) : ''}${c.GSTIN ? '<br>GSTIN: ' + esc(c.GSTIN) : ''}</div>
        <div style="text-align:right"><span>Invoice no</span><b>${esc(v.InvoiceNo)}</b><br><span style="margin-top:6px">Date</span>${fmtDate(v.Date)}<br>
          <span class="badge" style="color:${color};margin-top:6px">${v.Status}</span></div></div>
      <table><thead><tr><th>#</th><th>Description</th>${gst ? '<th>HSN</th>' : ''}<th class="n">Pockets</th><th class="n">Rate / pocket</th>${gst ? '<th class="n">GST %</th>' : ''}<th class="n">Amount</th></tr></thead><tbody>` +
      v.lines.map((l, i) => { const p = pn(l.ProductID); return `<tr><td>${i + 1}</td><td>${esc(p.Name || l.ProductID)} – ${esc(l.PocketSizeG)} g pocket</td>${gst ? `<td>${esc(p.HSN)}</td>` : ''}<td class="n">${l.Pockets}</td><td class="n">${rs(l.Rate)}</td>${gst ? `<td class="n">${l.TaxPercent}%</td>` : ''}<td class="n">${rs(l.Amount)}</td></tr>`; }).join('') +
      `</tbody></table>
      <table class="tot"><tr><td>Sub total</td><td class="n">${rs(v.SubTotal)}</td></tr>${gst ? `<tr><td>GST</td><td class="n">${rs(v.TaxAmount)}</td></tr>` : ''}
        <tr class="g"><td>Total</td><td class="n">${rs(v.Total)}</td></tr><tr><td>Paid</td><td class="n">${rs(v.Paid)}</td></tr>
        <tr class="g"><td>Balance due</td><td class="n">${rs(v.Balance)}</td></tr></table>
      ${v.Notes ? `<p style="margin-top:14px"><b>Notes:</b> ${esc(v.Notes)}</p>` : ''}
      <div class="sign"><div>Received by</div><div>For ${esc(S.CompanyName || 'Meima Foods')}</div></div>`;
  } catch (e) { document.getElementById('inv').innerHTML = `<p style="color:#b00020">${esc(e.message)}</p>`; if (!Meima.isLoggedIn()) location.reload(); }
});
</script>
</body>
</html>
