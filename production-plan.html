<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meima – Production Plan</title>
<style>
  :root{--brand:#7a2e1a;--bg:#faf5ee;--line:#e4d8c8;--ink:#2b2118}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
  main{max-width:1000px;margin:0 auto;padding:16px}
  .ctl{display:flex;gap:12px;flex-wrap:wrap;align-items:end;background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:12px}
  .ctl label{display:block;font-size:13px;margin-bottom:4px}
  input,select{padding:8px;border:1px solid var(--line);border-radius:6px;font:inherit}
  button.pri{background:var(--brand);color:#fff;border:0;padding:9px 16px;border-radius:6px;cursor:pointer}
  #status{min-height:20px;margin-bottom:8px;font-size:13px;color:#b26a00}
  #doc{background:#fff;border:1px solid var(--line);border-radius:8px;padding:20px}
  .dh{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--brand);padding-bottom:10px;margin-bottom:12px}
  .dh h2{margin:0;color:var(--brand);font-size:20px}
  .meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 16px;margin-bottom:14px}
  .meta span{color:#8a7a68;font-size:12px;display:block}
  table{border-collapse:collapse;width:100%}
  th,td{border:1px solid var(--line);padding:6px 8px;text-align:right}
  th:first-child,td:first-child{text-align:left}
  th{background:#f3e9dc;font-size:13px}
  tfoot td{font-weight:700;background:#faf5ee}
  .sign{display:flex;justify-content:space-between;margin-top:56px;font-size:13px}
  .sign div{border-top:1px solid #444;width:30%;padding-top:4px;text-align:center}
  @page{size:A4 landscape;margin:12mm}
  @media print{.noprint{display:none!important}body{background:#fff}main{max-width:none;padding:0}#doc{border:0;padding:0}}
</style>
</head>
<body>
<div id="hdr" class="noprint"></div>
<main>
  <div class="ctl noprint">
    <div><label>Masala</label><select id="prod"></select></div>
    <div><label>Batches</label><input id="n" type="number" min="1" max="10" value="1" style="width:80px"></div>
    <div><label>Date</label><input id="dt" type="date"></div>
    <div><label>Prepared by</label><input id="by" type="text"></div>
    <button class="pri" onclick="window.print()">Print / Save as PDF</button>
  </div>
  <div id="status" class="noprint"></div>
  <div id="doc"></div>
</main>

<script src="meima-api.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => Number(n).toLocaleString('en-IN');
let P = [], B = [], M = [], S = {}, ST = {}, lastProd = '';

Meima.requireLogin(init);

async function init() {
  $('#hdr').innerHTML = Meima.header('Production Plan', '<a href="masters.html" style="color:#7a2e1a;font-size:14px">Masters</a>');
  $('#dt').value = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  try {
    let boms, stk;
    [P, boms, M, S, stk] = await Promise.all([Meima.list('Products'), Meima.call('bom.list'), Meima.list('Materials'), Meima.settings(), Meima.call('stock.list')]);
    stk.forEach(x => { ST[x.MaterialID] = x.QtyKg; });
    B = boms.flatMap(b => b.lines.map(l => ({ ProductID: b.ProductID, MaterialID: l.MaterialID, QtyG: l.QtyG })));
    P.forEach(p => { const b = boms.find(x => x.ProductID === p.ProductID); p.StdBatchInputKg = b ? Number(b.BatchSizeG) / 1000 : 0; });
  } catch (e) {
    $('#status').textContent = e.message;
    if (!Meima.isLoggedIn()) location.reload();
    return;
  }
  $('#prod').innerHTML = P.map(p => `<option value="${esc(p.ProductID)}">${esc(p.Name)}</option>`).join('');
  ['prod', 'n', 'dt', 'by'].forEach(id => $('#' + id).addEventListener('input', render));
  render();
}

function render() {
  const prod = P.find(p => p.ProductID === $('#prod').value);
  if (!prod) { $('#doc').innerHTML = '<p>Add a masala in Masters first.</p>'; return; }

  const all = B.filter(r => r.ProductID === prod.ProductID);
  const n = Math.min(10, Math.max(1, parseInt($('#n').value) || 1));
  const rows = all;
  const name = id => (M.find(m => m.MaterialID === id) || {}).Name || id;

  if (!rows.length) {
    $('#status').textContent = '';
    $('#doc').innerHTML = '<p>No BOM for this masala yet. Add it in Masters → BOM.</p>';
    return;
  }

  const per = rows.reduce((s, r) => s + Number(r.QtyG || 0), 0);
  const std = Number(prod.StdBatchInputKg || 0) * 1000;
  $('#status').textContent = (std && per !== std)
    ? `Note: this BOM totals ${fmt(per)} g but the standard batch is ${fmt(std)} g. Check the BOM in Masters.` : '';

  const short = rows.filter(r => (ST[r.MaterialID] || 0) < Number(r.QtyG || 0) * n / 1000).length;
  if (short) $('#status').textContent += ` ${short} material(s) are short of stock.`;
  const batchHeads = n > 1 ? Array.from({ length: n }, (_, i) => `<th>Batch ${i + 1} (g)</th>`).join('') : '';
  const body = rows.map(r => {
    const q = Number(r.QtyG || 0), have = Number(ST[r.MaterialID] || 0);
    const cells = n > 1 ? `<td>${fmt(q)}</td>`.repeat(n) : '';
    return `<tr><td>${esc(name(r.MaterialID))}</td><td>${fmt(q)}</td>${cells}<td><strong>${fmt(q * n)}</strong></td><td>${(q * n / 1000).toFixed(3)}</td><td style="color:${have < q * n / 1000 ? '#b00020' : '#1b7a3a'}">${have.toFixed(3)}${have < q * n / 1000 ? ' (short)' : ''}</td></tr>`;
  }).join('');
  const foot = `<tr><td>Total</td><td>${fmt(per)}</td>${n > 1 ? `<td>${fmt(per)}</td>`.repeat(n) : ''}<td>${fmt(per * n)}</td><td>${(per * n / 1000).toFixed(3)}</td><td></td></tr>`;

  const date = $('#dt').value;
  document.title = `Production Plan - ${prod.Name} x${n} - ${date}`;
  $('#doc').innerHTML = `
    <div class="dh">
      <img src="${Meima.LOGO}" alt="MeiMa" style="height:64px">
      <div style="text-align:right"><h2>Production Plan – Material Issue Slip</h2>
        <div style="font-size:13px">${esc(S.CompanyName || '')}${S.FSSAI ? ' · FSSAI Lic. No. ' + esc(S.FSSAI) : ''}</div></div>
    </div>
    <div class="meta">
      <div><span>Masala</span>${esc(prod.Name)}</div>
      <div><span>Batches planned</span>${n}</div>
      <div><span>Standard batch input</span>${std ? (std / 1000).toFixed(3) + ' kg' : '—'}</div>
      <div><span>Plan date</span>${esc(date)}</div>
      <div><span>Prepared by</span>${esc($('#by').value) || '—'}</div>
      <div><span>Total input</span>${(per * n / 1000).toFixed(3)} kg</div>
    </div>
    <table>
      <thead><tr><th>Material</th><th>Per batch (g)</th>${batchHeads}<th>Total to issue (g)</th><th>Total (kg)</th><th>In stock (kg)</th></tr></thead>
      <tbody>${body}</tbody><tfoot>${foot}</tfoot>
    </table>
    <div class="sign"><div>Issued by (Stock)</div><div>Received by (Production)</div><div>Approved by</div></div>`;
}
</script>
</body>
</html>
